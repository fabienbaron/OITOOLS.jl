# MYSTIC at CHARA.
# Transcribed from ASPRO 2's aspro-conf CHARA.xml, instrument MIRCX-MYSTIC, setup MYSTIC_SETUP.
name = "MYSTIC"

# ASPRO's corrected transmission: aspro-conf says 0.01, which includes the band-mean
# atmosphere, and `ConfigurationManager` divides it out by 0.8219 -- the mean over MIRCX-MYSTIC's
# whole J-to-K range, since ASPRO treats the two as one instrument. See MIRCX.toml.
transmission = 0.0121671
instrument_visibility = 0.9

dit = 0.025               # 25 ms
total_int_time = 600.0
detector_saturation = 50000.0
read_noise = 1.5
quantum_efficiency = 0.7

n_pix_fringe = 100
n_pix_photometry = 2
flux_frac_fringes = 0.80
flux_frac_photometry = 0.20

vis_cal_err = 0.01
phase_cal_err = 1.0
