# MIRC-X Medium_H at CHARA, 42 spectral channels.
#
# aspro-conf dd79c85 (2026-09-24) CHARA.xml declares this mode as MIRCX_SETUP, resolution
# 190, 1.40 - 1.75 um; the channel centres and widths below are ASPRO 2 26.09's own expansion
# of that, read out of the OI_WAVELENGTH table it writes. Delivered resolution across the
# band is 169 - 209.
#
# Cross-checked against ASPRO's error bars through `tools/compare_errors.jl`: at H = 0 every
# channel agrees to 1.00 on sigma(V2), sigma(CP), sigma|V| and sigma(phi). Above H ~ 5 expect
# a drift to ~1.5 at the red band edge and outliers around 1.40 um; both causes are recorded
# in TODO.md and neither is in the noise algebra.
