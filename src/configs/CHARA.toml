name = "CHARA"
lat = 34.2243836944
lon = -118.0570313111
alt = 1731.264
# Civil local time for the Gantt. See `local_utc_offset`: the US rule for this zone is
# written out rather than looked up, since there is no time-zone database in this package.
timezone = "America/Los_Angeles"
site = "Mount Wilson"
# The drives still track above this but report a warning, so ASPRO draws the time above it as a
# separate dashed window rather than as lost. The hard ceiling is the telescopes' maxElevation
# of 85, which is `alt_max`'s default.
alt_soft_max = 80.0
throughput = 1.0
wind_speed = 6.95
r0 = 0.078

# Atmosphere at Mount Wilson. seeing is at 500 nm at zenith; t0 is the coherence time.
# r0 above is kept for backwards compatibility and is equivalent to seeing = 1.36".
seeing = 1.0
t0 = 3.2e-3

# CHARA adaptive optics, all six telescopes. Values match ASPRO 2's AO_CHARA setup
# (CHARA 2026A configuration). strehl_max = 0 selects the per-band default, it does NOT
# mean "no ceiling".
[ao]
band = "V"
n_subpupils = 36
n_actuators = 24
dit = 2.0e-3
ron = 5.0
qe = 0.7
transmission = 0.0
mag_offset = 0.0
strehl_max = 0.0

[[telescope]]
name = "S1"
station = "S1"
diameter = 1.0
gain = 1.0
index = 1
xyz = [0.0, 0.0, 0.0]
# Delay cart travel, metres: the front and back limit switches. The optical path changes
# by TWICE the cart motion, so the usable OPD span is 2*(back - front) -- which is the
# number ASPRO 2 stores as <maximumThrow>. `delay_length` below is that span in CART
# metres and is what `in_delay` compares against; it is back - front.
delay_front = -1.42
delay_back  = 44.32
delay_length = 45.74
# POP optical path, metres, one per POP. Referenced to this station's OWN zero POP, which
# differs between stations -- S2 is zeroed on PoP2, E2 and W1 on PoP3, W2 on PoP5 -- which
# is the convention aspro-conf uses and what makes the per-baseline differences come out
# right. Matches aspro-conf's <popLink> optical lengths to about a millimetre.
pop_offsets = [0.0, 36.5639684, 73.1289412, 109.7249843, 143.0358086]
# Fixed AIR PATH ahead of the delay line, metres: the beam's run through the tunnels before
# it reaches its cart, which differs per telescope. aspro-conf calls this
# <delayLineFixedOffset> and these are its values, which is what ASPRO 2's own delay model
# runs on. It enters the optical path difference exactly as any fixed length does.
fixed_offset = 0.0
# Beam Sampling Table: the optical length this station contributes through each of the
# six beam channels V1..V6, metres. Which channel a telescope feeds depends on WHERE IT
# SITS in the chosen configuration, not on the telescope, so the same six telescopes in
# a different order give a different path. Worth 0.21 to 1.05 m per baseline.
bst = [0.41969889, 0.21083742, 0, -0.21037447, -0.42102104, -0.63097768]
# Azimuth-dependent horizon: the terrain and buildings this telescope looks over,
# as a polyline of (azimuth, minimum elevation) in degrees. A target must clear the
# horizon of EVERY telescope in use, so the effective limit is the max over them and
# therefore depends on which are selected -- which a single number cannot express.
# At Mount Wilson this runs from 18 deg in the south to 48 deg to the north-west.
