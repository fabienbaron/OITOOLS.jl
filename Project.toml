TOML = "fa267f1f-6049-4f14-aa54-33bafae1ed76"

[weakdeps]
GLFW_jll = "0656b61e-2033-5cc2-a64a-77c0f6c09b89"
GLMakie = "e9467ef8-e4e7-5192-8a1a-b1aee30e663a"
Makie = "ee78f7c6-11fb-53f2-987a-cfe4a2b5a57a"
Pigeons = "0eb8d820-af6a-4919-95ae-11206f830c31"
PythonPlot = "274fc56d-3b97-40fa-a1cd-1b4a50311bf9"
QML = "2db162a6-7e43-52c3-8d84-290c1c42d82a"
QMLMakie = "08f9cac3-3b11-4f1c-9d88-d0e81c500f64"

[extensions]
OITOOLSGUIExt = ["GLMakie", "Makie", "QML", "QMLMakie"]
OITOOLSGLFWExt = "GLFW_jll"        # prefer_native_wayland! only; must load before GLMakie
OITOOLSPigeonsExt = "Pigeons"
OITOOLSPythonPlotExt = "PythonPlot"

[compat]
# The GUI stack. These are weak dependencies: `using OITOOLS` loads none of them, and the
# bounds only matter to whoever opens the GUI. Pinned to the minor version each was developed
# against, because Makie and QML both break API across minors.
GLFW_jll = "3.4"
GLMakie = "0.13"
Makie = "0.24"
QML = "0.13"
QMLMakie = "0.3"
Pigeons = "0.4"
ADTypes = "1.21.0"
FiniteDifferences = "0.12.33"
LogDensityProblemsAD = "1.13.1"
OIFITS = "1"
CondaPkg = "0.2"
PythonCall = "0.9"
PythonPlot = "1"
julia = "1.12"

[extras]
PythonPlot = "274fc56d-3b97-40fa-a1cd-1b4a50311bf9"
Serialization = "9e88b42a-f829-5b0c-bbe9-9e923198166b"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
# PythonPlot is a weak dependency of the package but a hard one of the tests:
# test_plotting.jl exercises every figure, and that needs the extension loaded.
test = ["Test", "Serialization", "PythonPlot"]

# The Conda environment every project in this repo shares, at
# <depot>/conda_environments/oitools.
#
# CondaPkg otherwise builds one per ACTIVE PROJECT — `dirname(Base.active_project())/.CondaPkg`
# — so this repo grew three of them, and the [workspace] above made that worse rather than
# better: one shared manifest means each project resolves the union of every member's Python
# dependencies, so all three reached the same full set. Measured at 763 MB + 1.6 GB + 1.6 GB of
# the same packages, against 1.6 GB once.
#
# Set HERE rather than through JULIA_CONDAPKG_ENV because a preference is a committed file that
# reads identically on Windows, macOS and Linux, needs no shell profile, and is scoped to this
# repo instead of to every Julia project on the machine.
#
# CondaPkg is listed in [deps] for this to work at all: Preferences resolves only for DIRECT
# dependencies, and reached indirectly through PythonCall it returns nothing with no error. It
# is a real dependency in substance either way — this package ships a CondaPkg.toml.
[preferences.CondaPkg]
env = "@oitools"
