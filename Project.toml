name = "OITOOLS"
uuid = "3fc04337-ac9e-422b-9e4b-9feddb92e93f"
keywords = ["astronomy", "interferometry"]
license = "GPLv3"
desc = "The all-in-one data analysis package for optical interferometry"
version = "0.13.0"
authors = ["Fabien Baron <fbaron@gsu.edu>"]

# One resolution for the package and the two environments that live beside it, sharing this
# directory's Manifest.toml. `docs/` and `bin/` therefore have no manifest of their own.
#
# Why: they were resolved independently and drifted. Measured before this was added, the root
# and launcher manifests disagreed on the version of 50 shared packages — ForwardDiff 1.3.3
# against 1.4.5, StatsFuns 1.5.2 against 2.2.1, and so on. Julia keys a precompile cache to
# the whole resolved dependency graph, so every one of those packages was compiled twice and
# switching environments recompiled what the other had just built. OITOOLS alone held nine
# cache files and 599 MB.
[workspace]
projects = ["docs", "bin"]

[deps]
ADTypes = "47edcb42-4c32-4615-8424-f2b9edc5f35b"
ArrayTools = "1dc0ca97-c5ce-4e77-ac6d-c576ac9d7f27"
ChainRulesCore = "d360d2e6-b24c-11e9-a2a3-2a2ae2dbcce4"
CondaPkg = "992eb4ea-22a4-4c89-a5bb-47a3300528ab"
Crayons = "a8cc5b0e-0ffa-5ad4-8c14-923d3ee1735f"
Dates = "ade2ca70-3891-5945-98fb-dc099432e06a"
DelimitedFiles = "8bb1440f-4735-579b-a4ab-409b98df4dab"
FFTW = "7a1cc6ca-52ef-59f5-83cd-3a7055c09341"
FiniteDifferences = "26cc04aa-876d-5657-8c51-4c34ba976000"
FITSIO = "525bcba6-941b-5504-bd06-fd0dc1a4d2eb"
ForwardDiff = "f6369f11-7733-5829-9624-2563aa707210"
LaTeXStrings = "b964fa9f-0449-5b57-a5c2-d3ea65f4040f"
