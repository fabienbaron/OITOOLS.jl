# The GUI stack. These are weak dependencies: `using OITOOLS` loads none of them, and the
# bounds only matter to whoever opens the GUI. Pinned to the minor version each was developed
# against, because Makie and QML both break API across minors.
#
# The samplers and the plotting backends are weak for the same reason and a stronger one:
# `using OITOOLS` must load neither Python nor Makie. PythonCall is here rather than in [deps]
# because nested sampling and matplotlib are the only things that ever wanted it.
[weakdeps]
GLFW_jll = "0656b61e-2033-5cc2-a64a-77c0f6c09b89"
GLMakie = "e9467ef8-e4e7-5192-8a1a-b1aee30e663a"
Makie = "ee78f7c6-11fb-53f2-987a-cfe4a2b5a57a"
Nautilus = "0c5b9d3e-7a41-4d2f-9e6c-8b1f4a2d5c73"
PairPlots = "43a3c2be-4208-490b-832a-a21dcd55d7da"
Pigeons = "0eb8d820-af6a-4919-95ae-11206f830c31"
PythonCall = "6099a3de-0909-46bc-b1f4-468b9a2dfc0d"
PythonPlot = "274fc56d-3b97-40fa-a1cd-1b4a50311bf9"
QML = "2db162a6-7e43-52c3-8d84-290c1c42d82a"
QMLMakie = "08f9cac3-3b11-4f1c-9d88-d0e81c500f64"

# Triggers are the packages that must be loaded, not the feature's name. Two are worth reading
# twice: OITOOLSPythonPlotExt names PythonCall as well as PythonPlot, because src/oiplot.jl
# calls `pyimport` directly and an extension may only use its parent's dependencies and its own
# triggers; and OITOOLSMakieExt keys on Makie rather than a backend, so CairoMakie, GLMakie and
# QMLMakie all activate it. OITOOLSPairPlotsExt names Makie for the same reason as the first:
# it builds the Figure that PairPlots draws into.
#
# Pkg REWRITES AND SORTS THIS BLOCK on any `Pkg.add`/`Pkg.resolve`, discarding comments inside
# it. Anything explanatory therefore lives above the header, where it survives.
# Nautilus.jl is not registered, so the weak dependency above needs a source. A URL rather
# than a sibling path: a path only resolves on a machine that happens to have the checkout
# next door, which rsyncing this repo elsewhere does not guarantee.
[sources]
Nautilus = {url = "https://github.com/fabienbaron/Nautilus.jl.git"}

[extensions]
OITOOLSGLFWExt = "GLFW_jll"
OITOOLSGUIExt = ["GLMakie", "Makie", "QML", "QMLMakie"]
OITOOLSNautilusExt = "Nautilus"
OITOOLSPairPlotsExt = ["PairPlots", "Makie"]
OITOOLSMakieExt = "Makie"
OITOOLSPigeonsExt = "Pigeons"
OITOOLSPythonPlotExt = ["PythonPlot", "PythonCall"]
OITOOLSUltraNestExt = "PythonCall"

[compat]
ADTypes = "1.21.0"
CondaPkg = "0.2"
Downloads = "1"
FiniteDifferences = "0.12.33"
GLFW_jll = "3.4"
GLMakie = "0.13"
LogDensityProblemsAD = "1.13.1"
Makie = "0.24"
# Nautilus.jl is the Julia port of the `nautilus` importance nested sampler. Unregistered as
# yet, so it must be reached with `Pkg.develop(path = ...)`; the bound is here so that a later
# registered release resolves without further edits.
Nautilus = "0.1"
PairPlots = "2, 3"
OIFITS = "1"
Pigeons = "0.4"
PythonCall = "0.9"
PythonPlot = "1"
QML = "0.13"
QMLMakie = "0.3"
julia = "1.12"

[extras]
Nautilus = "0c5b9d3e-7a41-4d2f-9e6c-8b1f4a2d5c73"
PythonCall = "6099a3de-0909-46bc-b1f4-468b9a2dfc0d"
PythonPlot = "274fc56d-3b97-40fa-a1cd-1b4a50311bf9"
Serialization = "9e88b42a-f829-5b0c-bbe9-9e923198166b"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

# The Conda environment every project in this repo shares, at
# <depot>/conda_environments/oitools.
#
# CondaPkg otherwise builds one per ACTIVE PROJECT — `dirname(Base.active_project())/.CondaPkg`
# — so this repo grew three of them, and the [workspace] above made that worse rather than
# better: one shared manifest means each project resolves the union of every member's Python
# dependencies, so all three reached the same full set. Measured at 763 MB + 1.6 GB + 1.6 GB of
# the same packages, against 1.6 GB once.
#
# Set HERE rather than through JULIA_CONDAPKG_ENV because a preference is a committed file that
# reads identically on Windows, macOS and Linux, needs no shell profile, and is scoped to this
# repo instead of to every Julia project on the machine.
#
# CondaPkg is listed in [deps] for this to work at all: Preferences resolves only for DIRECT
# dependencies, and reached indirectly through PythonCall it returns nothing with no error. It
# is a real dependency in substance either way — this package ships a CondaPkg.toml.
[preferences.CondaPkg]
env = "@oitools"

# PythonPlot is a weak dependency of the package but a hard one of the tests:
# test_plotting.jl exercises every figure, and that needs the extension loaded.
[targets]
# PythonCall is named as well as PythonPlot even though PythonPlot depends on it: the tests
# `using PythonCall` directly for `pyimport`/`pyconvert`, and `using` a package requires it to
# be a direct dependency of the active project, not merely a loaded one.
test = ["Test", "Serialization", "PythonPlot", "PythonCall", "Nautilus"]
