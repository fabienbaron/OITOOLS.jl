# Uniform disc — the first fit on a resolved star, and the reference every other diameter is
# quoted against. One free parameter: `ud` is the angular diameter in milliarcseconds.
#
# A UD diameter is not the star's diameter. The disc has a hard edge and a real photosphere
# does not, so θ_UD comes out a few percent smaller than θ_LD; LD_power.toml is the model that
# measures the difference.
#
# CHANGE THE STARTING VALUE BEFORE FITTING, and do not rely on the bounds to rescue a bad one.
# V² from a disc oscillates, so a seed in the wrong lobe converges to the wrong lobe: measured
# on demos/data/AlphaCenA.oifits, a seed of 8 mas gives θ_UD = 8.307 mas at χ²r = 15.2 (the
# published value), while seeds of 3 and 5 mas both walk out to whichever bound is nearest,
# with χ²r near 1000. Narrowing the box does not help — [1, 15] and [5, 12] give the same
# answers as [0, 20] for the same seeds.
#
# A usable first guess comes from the data rather than from a table: the array resolves scales
# of about λ/B_max, and the first V² null sits near 1.22 λ/B.

name = "uniform disk"

free = ["star,ud"]

[model]
"star,ud" = 8.0
"star,f"  = 1.0

# Bounds matter here beyond keeping the optimiser honest: UltraNest refuses to run at all
# unless every free parameter has finite bounds. With these it runs as it stands, and on
# AlphaCenA returns θ_UD = 8.3067 +- 0.0011 mas — the same point estimate as the gradient
# fitters, with the error bar they cannot give.
[bounds]
"star,ud" = [0.0, 20.0]
