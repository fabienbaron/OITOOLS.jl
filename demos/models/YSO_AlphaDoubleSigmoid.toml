# Ibrahim et al. 2023, ApJ 947, 68 — HD 190073 (V1295 Aql), the α Double Sigmoid model:
# the double sigmoid with emission inside the inner edge (Eq. 3).
#
# Three components, as in the paper: an unresolved star with a Rayleigh-Jeans spectrum
# (λ/λ0)^−4, the disc, and an over-resolved halo, the disc and the halo each with its own
# spectral slope. The fluxes are expressions in `$WL` (microns) over one shared denominator, so
# they sum to 1 at every wavelength: `fs` and `fd` are the star's and the disc's fractions at
# λ0 = 1.6 µm, the halo has the rest. Values: the paper's best fit for epoch A (Table 4),
# a starting point for demos/data/V1295_Aql.oifits.
#
# I(r) = (α + (1 − α)/(1 + e^−(r−R_in)/σ_in)) · 1/(1 + e^(r−R_out)/σ_out): α, here `ain`, is the
# brightness inside the inner edge relative to the ring's, 0 being the plain double sigmoid.
# Epoch A's inner edge is almost a step (σ_in = 0.01 mas); the Hankel transform resolves it.

name = "HD 190073 — α Double Sigmoid (Ibrahim et al. 2023)"
wl_unit = "um"     # `$WL` in the expressions is in microns

free = ["fs", "fd", "disk,slope", "halo,slope", "disk,incl", "disk,projang", "disk,rin", "disk,rout", "disk,sigin", "disk,sigout", "disk,ain"]

[model]
# The star: unresolved.
"star,f" = "$fs * ($WL/1.6)^(-4) / ($fs * ($WL/1.6)^(-4) + $fd * ($WL/1.6)^$disk,slope + (1 - $fs - $fd) * ($WL/1.6)^$halo,slope)"

# The disc.
"disk,profile" = "($ain + (1 - $ain)/(1 + exp(-($R - $rin)/$sigin))) * 1/(1 + exp(($R - $rout)/$sigout))"
"disk,rin"     = 1.2
"disk,rout"    = 1.2
"disk,sigin"   = 0.01
"disk,sigout"  = 0.48
"disk,diamout" = 12.0     # the profile's grid, r from 0 to 6 mas: the sigmoids have fallen to nothing well inside it
"disk,ain"     = 0.19
"disk,incl"     = 9.91
"disk,projang"  = 0.2
"disk,f"     = "$fd * ($WL/1.6)^$disk,slope / ($fs * ($WL/1.6)^(-4) + $fd * ($WL/1.6)^$disk,slope + (1 - $fs - $fd) * ($WL/1.6)^$halo,slope)"
"disk,slope" = 0.09

# The halo: over-resolved, all its flux at baselines shorter than any measured.
"halo,resolved" = true
"halo,f"     = "(1 - $fs - $fd) * ($WL/1.6)^$halo,slope / ($fs * ($WL/1.6)^(-4) + $fd * ($WL/1.6)^$disk,slope + (1 - $fs - $fd) * ($WL/1.6)^$halo,slope)"
"halo,slope" = 4.56

fs = 0.41
fd = 0.56

[bounds]
fs                = [0.0, 1.0]
fd                = [0.0, 1.0]
"disk,slope"      = [-4.0, 4.0]
"halo,slope"      = [-4.0, 8.0]
"disk,incl"       = [0.0, 90.0]
"disk,projang"    = [-180.0, 180.0]
"disk,rin"        = [0.1, 4.0]
"disk,rout"       = [0.1, 4.0]
"disk,sigin"      = [0.005, 2.0]
"disk,sigout"     = [0.005, 2.0]
"disk,ain"         = [0.0, 1.0]
