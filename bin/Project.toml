# The launcher environment.
#
# Running the GUI needs GLMakie, QMLMakie and QML, which OITOOLS keeps as WEAK dependencies so
# that `using OITOOLS` costs 0.9 s instead of 8 and maps no Qt. Weak dependencies are not
# loadable from `--project=.`, so this environment declares them as ordinary ones and pins the
# whole GL and Qt stack in its Manifest.
#
#     julia --project=bin bin/oitoolsgui.jl [file.oifits]
#
# `julia --project=bin -e 'using Pkg; Pkg.instantiate()'` reproduces the exact versions.
#
# Four of the entries below are not the launcher's:
#
#   PythonPlot, PythonCall  test/gui/'s port harness compares Makie output against oiplot's
#                           matplotlib originals, and PythonCall is what makes the UltraNest
#                           sampler selectable. The launcher loads neither, so they cost the
#                           GUI nothing at run time.
#   Nautilus                importance nested sampling, the other pure-Julia sampler
#   PairPlots               corner plots, likewise.
#   PackageCompiler         bin/compile.jl only. Never loaded by the GUI.
#
# No name/uuid: this is an environment, not a package.

[deps]
CondaPkg = "992eb4ea-22a4-4c89-a5bb-47a3300528ab"
GLFW_jll = "0656b61e-2033-5cc2-a64a-77c0f6c09b89"
GLMakie = "e9467ef8-e4e7-5192-8a1a-b1aee30e663a"
Nautilus = "0c5b9d3e-7a41-4d2f-9e6c-8b1f4a2d5c73"
OITOOLS = "3fc04337-ac9e-422b-9e4b-9feddb92e93f"
PackageCompiler = "9b87118b-4619-50d2-8e1e-99f35a4d4d9d"
PairPlots = "43a3c2be-4208-490b-832a-a21dcd55d7da"
Pigeons = "0eb8d820-af6a-4919-95ae-11206f830c31"
PythonCall = "6099a3de-0909-46bc-b1f4-468b9a2dfc0d"
PythonPlot = "274fc56d-3b97-40fa-a1cd-1b4a50311bf9"
QML = "2db162a6-7e43-52c3-8d84-290c1c42d82a"
QMLMakie = "08f9cac3-3b11-4f1c-9d88-d0e81c500f64"
TOML = "fa267f1f-6049-4f14-aa54-33bafae1ed76"
VarInf = "cd771066-68b7-4d72-889c-da7b55f139d5"

[sources]
Nautilus = {url = "https://github.com/fabienbaron/Nautilus.jl.git"}
OITOOLS = {path = ".."}
# VarInf is the generic VI core: unregistered, so it is named by URL rather than resolved from
# a registry. A URL and not a path, because `bin` is a workspace member of the root project and
# a workspace shares one manifest -- so a relative path here is resolved when the ROOT project
# is instantiated, on a CI runner that has no sibling checkout, and the whole resolve fails.
#
# To WORK ON VarInf, `Pkg.develop(path = "…/VarInf.jl")` into this environment: that writes to
# the manifest, which is gitignored, so the override stays local and CI still sees the URL.
VarInf = {url = "https://github.com/fabienbaron/VarInf.jl.git"}

# The Conda environment every project in this repo shares, at
# <depot>/conda_environments/oitools.
#
# CondaPkg otherwise builds one per ACTIVE PROJECT — `dirname(Base.active_project())/.CondaPkg`
# — so this repo grew three of them, and the [workspace] above made that worse rather than
# better: one shared manifest means each project resolves the union of every member's Python
# dependencies, so all three reached the same full set. Measured at 763 MB + 1.6 GB + 1.6 GB of
# the same packages, against 1.6 GB once.
#
# Set HERE rather than through JULIA_CONDAPKG_ENV because a preference is a committed file that
# reads identically on Windows, macOS and Linux, needs no shell profile, and is scoped to this
# repo instead of to every Julia project on the machine.
#
# CondaPkg is listed in [deps] for this to work at all: Preferences resolves only for DIRECT
# dependencies, and reached indirectly through PythonCall it returns nothing with no error. It
# is a real dependency in substance either way — this package ships a CondaPkg.toml.
[preferences.CondaPkg]
env = "@oitools"
