# Python dependencies, declared.
#
# Before this file existed these six imports were undeclared, so whether they worked depended
# on whatever happened to be in the user's Conda.jl environment:
#
#   matplotlib, mpl_toolkits.axes_grid1   -> oiplot.jl (a HARD load-time dependency: without
#                                            matplotlib, `using OITOOLS` fails outright)
#   astroquery.simbad                     -> utils.jl, magnitudes_from_simbad
#   ultranest, ultranest.plot,
#   ultranest.stepsampler                 -> fit_model.jl, fit_model_ultranest
#
# That was not hypothetical: the previous unmanaged environment had drifted to numpy 2.5.2
# alongside astropy 6.1.4, and astropy still calls `np.in1d`, which numpy removed in 2.0. The
# result was that `magnitudes_from_simbad` raised AttributeError on every call. Declaring the
# dependencies lets the solver keep them mutually consistent.
#
# numpy is pinned below 2 because astropy/astroquery in the versions we need still use APIs
# numpy removed in 2.0. Revisit once astroquery's astropy requirement moves past that.

channels = ["conda-forge"]

[deps]
python = ">=3.9,<4"
matplotlib = ">=3.5"
numpy = ">=1.23,<2"

# astroquery and ultranest are pip-installed: ultranest is not on conda-forge for all
# platforms, and pip resolves both against the conda-provided numpy above.
[pip.deps]
astroquery = ">=0.4.6"
ultranest = ">=3.6"
