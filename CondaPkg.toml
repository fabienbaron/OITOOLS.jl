# Python dependencies.
#
#   matplotlib, mpl_toolkits.axes_grid1   -> oiplot.jl (required to load the package: all
#                                            plotting goes through matplotlib)
#   astroquery.simbad                     -> utils.jl, magnitudes_from_simbad
#   ultranest, ultranest.plot,
#   ultranest.stepsampler                 -> fit_model.jl, fit_model_ultranest
#
# numpy must be >= 2. PythonCall's `juliacall.ArrayValue.__array__` (JlWrap/array.jl) ends in
#
#     return numpy.array(arr, dtype=dtype, copy=copy)
#
# with `copy=None` as the default — the numpy-2 spelling of "copy only if needed". numpy 1.x
# requires a bool there and raises `ValueError: NoneType copy mode not allowed.`
#
# numpy reaches that method only when it cannot use `__array_interface__`, so the breakage is
# data-dependent and easy to miss: dense arrays convert fine, while lazy adjoints, nested
# `Vector{Matrix}` (e.g. per-polygon vertex lists handed to PolyCollection/Poly3DCollection)
# and `Vector{Any}` all fail. Plotting a dense image works; plotting polygons does not.
#
# An earlier revision pinned numpy < 2 for astroquery's sake. That is obsolete: astropy 7
# guards the numpy-2 removals it used to call unconditionally (`if NUMPY_LT_2_4: def in1d`),
# and declares `numpy<2.7,>=1.24` itself. Leave the upper bound to astropy rather than
# duplicating it here, so a future astropy relaxation does not need an edit in this file.

channels = ["conda-forge"]

# scipy is an undeclared dependency of `ultranest.plot`, which does `import scipy.stats` at
# module level (plot.py:18) while ultranest's own metadata requires only numpy, cython,
# matplotlib and corner. pip therefore never installs it, and `ultranest.plot` — the corner
# plot that `fit_model_ultranest` draws by default (`cornerplot = true`) — is unimportable in
# a fresh environment even though the sampler itself runs fine. Declared here rather than
# waiting on upstream; drop it once ultranest lists scipy itself.
[deps]
python = ">=3.9,<4"
matplotlib = ">=3.5"
numpy = ">=2"
scipy = ">=1.9"

# astroquery and ultranest come from pip: ultranest is not on conda-forge for every platform,
# and pip resolves both against the conda-provided numpy above.
[pip.deps]
astroquery = ">=0.4.6"
ultranest = ">=3.6"
