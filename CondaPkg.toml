# Python dependencies.
#
#   matplotlib-base                       -> fit_model.jl sets rcParams around UltraNest's
#                                            corner plot; ultranest.plot needs it too
#   ultranest, ultranest.plot,
#   ultranest.stepsampler                 -> fit_model.jl, fit_model_ultranest
#   scipy                                 -> imported at module level by ultranest.plot
#
# EVERYTHING IS A CONDA DEPENDENCY ON PURPOSE — there is no [pip.deps] section.
#
# ultranest comes from conda-forge, not pip. Mixing pip and conda dependencies makes
# pixi fetch a conda->PyPI name mapping from a remote service before it can solve, and that
# fetch fails here:
#
#     × failed to map conda packages to their PyPI equivalents. This mapping is
#     ├─▶ failed to fetch conda-pypi mapping from remote source
#     ╰─▶ io error: unexpected end of file
#
# The failure is not specific to this project's manifest — the identical manifest resolves
# standalone — but it is reliable whenever CondaPkg resolves a *fresh* environment from
# Julia. That happens for every project except the one whose environment is already built,
# so it broke `Pkg.test()` (which runs in a temporary sandbox project) and
# `julia --project=docs docs/make.jl` (a second project, with its own 1.5 GB .CondaPkg),
# while the repo root kept working from its existing lock and hid the problem.
#
# The user-visible symptom is severe: PythonCall initialises CondaPkg at import, so a
# failed resolve makes `using OITOOLS` itself unloadable, not merely the Python-facing
# functions.
#
# Keeping the pip layer out removes the mapping fetch and with it the whole failure mode.
# ultranest is on conda-forge for every platform CI builds on (linux-64, osx-64,
# osx-arm64, win-64). The cost is that conda-forge's ultranest can lag PyPI slightly
# (4.4.0 vs 4.5.0 at the time of writing); the API OITOOLS uses — ReactiveNestedSampler,
# stepsampler.RegionSliceSampler(adaptive_nsteps=...), plot.cornerplot — is present and
# verified in 4.4.0. There is no conda-forge build for linux-aarch64; add a [pip.deps]
# section back only if that platform is ever needed, knowing what it costs.
#
# numpy must be >= 2. PythonCall's `juliacall.ArrayValue.__array__` (JlWrap/array.jl) ends in
#
#     return numpy.array(arr, dtype=dtype, copy=copy)
#
# with `copy=None` as the default — the numpy-2 spelling of "copy only if needed". numpy 1.x
# requires a bool there and raises `ValueError: NoneType copy mode not allowed.`
#
# numpy reaches that method only when it cannot use `__array_interface__`, so the breakage is
# data-dependent and easy to miss: dense arrays convert fine, while lazy adjoints, nested
# `Vector{Matrix}` (e.g. per-polygon vertex lists handed to PolyCollection/Poly3DCollection)
# and `Vector{Any}` all fail. Plotting a dense image works; plotting polygons does not.

# matplotlib-base, NOT matplotlib. On conda-forge `matplotlib` is a thin metapackage whose
# only content beyond `matplotlib-base` is a GUI toolkit: it depends on pyside6, which pulls
# qt6-main, which pulls libclang and libLLVM. Measured in this environment that subtree is
# 510 MB unpacked -- roughly half the whole thing -- for a Qt binding nothing here imports.
# The plotting OITOOLS does is Agg (headless, tests and docs) or whatever backend the user's
# own session provides.
#
# It also removes a real conflict rather than a merely theoretical one. The Qt that pyside6
# installs here is 6.11.1; QML.jl binds Qt 6.10.2 from its JLL, and two Qt builds in one
# process fail with an undefined private-API symbol that names nothing relevant. That is the
# failure OITOOLSGUI's `check_qt_conflict` exists to explain. With matplotlib-base there is
# no second Qt in an OITOOLS environment for it to find.
#
# Interactive matplotlib is unaffected where it is actually wanted: PythonPlot.jl carries its
# own `matplotlib = ">=1"`, so any environment with PythonPlot -- this package's test target,
# and any user session that loads it -- gets the full metapackage and its Qt backend back.
# Nothing is lost; the dependency simply moved to the package that needs it.

channels = ["conda-forge"]

[deps]
python = ">=3.9,<4"
matplotlib-base = ">=3.5"
numpy = ">=2"
scipy = ">=1.9"
ultranest = ">=3.6"
